name: Build Executables

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter psycopg2-binary pillow pywin32 pyinstaller

    - name: Build GERAR_CATALOGO
      run: |
        pyinstaller --noconsole --onefile --name GERAR_CATALOGO gerar_catalogo.py

    - name: Build VISUALIZAR_CATALOGO
      run: |
        pyinstaller --noconsole --onefile --name VISUALIZAR_CATALOGO visualizar_catalogo.py

    - name: Build APP_GESTAO_ENCARTE
      run: |
        pyinstaller --noconsole --onefile --collect-all customtkinter --name APP_GESTAO_ENCARTE app_gestao_encarte.py

    - name: Upload Executables
      uses: actions/upload-artifact@v3
      with:
        name: Executaveis_Encarte
        path: dist/*.exe
