name: Build and Deploy Catalog Generator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab>=4.0.0 Pillow>=10.0.0
          
      - name: Run catalog generator
        run: python gerar_catalogo.py
        
      - name: Upload generated images
        uses: actions/upload-artifact@v4
        with:
          name: encartes-jpg
          path: encartes_jpg/*.jpg
